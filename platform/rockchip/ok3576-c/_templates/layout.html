{% extends "!layout.html" %}

{% block extrahead %}
  {{ super() }}

  <!-- Load Font Awesome from CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8EJPNL8NR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N8EJPNL8NR');
  </script>
{% endblock %}

{% block sidebar_logo %}
  <a href="https://forlinxembedded.github.io/" class="icon icon-home">
    {# 保留主题默认 logo 渲染逻辑 #}
    {% if logo_url %}
      <img src="{{ pathto('_static/forlinx-logo.png', 1) }}" class="logo" alt="Forlinx Docs">
    {% else %}
      {{ project }}
    {% endif %}
  </a>
{% endblock %}
