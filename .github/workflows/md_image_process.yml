name: Process Markdown Images on Push

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**/**/*.md'  # 只触发 markdown 文件变动


jobs:
  process-images:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 保证能获取完整历史

      # 2️⃣ 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: pip install requests

      # 4️⃣ 获取本次 push 的 Markdown 文件，写入临时文件
      - name: Get list of changed markdown files
        run: |
          echo "::group::Detect changed .md files"
          git fetch origin main
          git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' > changed_md_files.txt || true
          echo "Changed Markdown files:"
          cat changed_md_files.txt
          echo "::endgroup::"

      # 5️⃣ 处理每个 Markdown 文件
      - name: Process changed markdown files
        run: |
          if [ -f changed_md_files.txt ]; then
            while read f; do
              if [ -f "$f" ]; then
                echo "📄 Processing $f"
                python ./scripts/process_md_images.py "$f"
              else
                echo "⚠️ File not found: $f"
              fi
            done < changed_md_files.txt
          else
            echo "⚠️ No changed Markdown files found"
          fi

      # 6️⃣ 提交并推送更新
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-update local image paths for changed md files"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
