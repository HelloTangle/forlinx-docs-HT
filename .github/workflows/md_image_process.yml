name: Process Markdown Images on Push

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**/**/*.md'  # 只触发 Markdown 文件变动

jobs:
  process-images:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: pip install requests

      # 4️⃣ 获取本次 push 的 Markdown 文件
      - name: Detect changed Markdown files
        id: detect_md
        run: |
          echo "::group::Detect changed .md files"
          git fetch origin main
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' || true)
          echo "Changed md files:"
          echo "$changed"
          echo "::endgroup::"

          # 将多行路径写入环境变量，避免 Invalid format
          echo "CHANGED_MD_FILES<<EOF" >> $GITHUB_ENV
          echo "$changed" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # 5️⃣ 处理每个 Markdown 文件
      - name: Process changed Markdown files
        if: env.CHANGED_MD_FILES != ''
        run: |
          echo "Processing changed Markdown files..."
          for f in $CHANGED_MD_FILES; do
            if [ -f "$f" ]; then
              echo "📄 Processing $f"
              python ./scripts/process_md_images.py "$f"
            else
              echo "⚠️ File not found: $f"
            fi
          done

      # 6️⃣ 提交并推送更新
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-update local image paths for changed md files"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        