name: Process Markdown Images on Push

on:
  push:
    branches:
      - main
    paths:
      - 'platform/**/**/*.md'  # 只触发 markdown 文件变动

jobs:
  process-images:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ 设置 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ 安装依赖
      - name: Install dependencies
        run: pip install requests

      # 4️⃣ 获取本次 push 的 Markdown 文件
      - name: Get list of changed markdown files
        id: changed_files
        run: |
          echo "::group::Detect changed .md files"
          git fetch origin main
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep '\.md$' || true)
          echo "Changed md files:"
          echo "$changed"
          echo "::endgroup::"

          # 写入环境文件，路径用引号包裹，避免非法字符报错
          echo "CHANGED_MD_FILES=\"$changed\"" >> $GITHUB_ENV

      # 5️⃣ 处理每个 Markdown 文件
      - name: Process changed markdown files
        if: env.CHANGED_MD_FILES != ''
        run: |
          echo "Processing changed markdown files..."
          for f in $CHANGED_MD_FILES; do
            # 去掉空格和引号
            file=$(echo $f | tr -d '"')
            if [ -f "$file" ]; then
              echo "📄 Processing $file"
              python ./scripts/process_md_images.py "$file"
            else
              echo "⚠️ File not found: $file"
            fi
          done

      # 6️⃣ 提交并推送更新
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Auto-update local image paths for changed md files"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
